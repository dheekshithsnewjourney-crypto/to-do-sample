<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#D62839">
  <title>Tasks – a to-do list that stays on your device</title>
  <meta name="description" content="A to-do list with due dates, priorities and repeating tasks. Type &quot;Pay rent tomorrow !high&quot; and it sets the date and the priority. Saved in your browser only.">
  <link rel="canonical" href="https://dheekshithsnewjourney-crypto.github.io/to-do-sample/">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Tasks – a to-do list that stays on your device">
  <meta property="og:description" content="Due dates, priorities and repeating tasks, typed in one line. Saved in your browser only.">
  <meta property="og:url" content="https://dheekshithsnewjourney-crypto.github.io/to-do-sample/">
  <meta property="og:image" content="https://dheekshithsnewjourney-crypto.github.io/to-do-sample/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="A red poster field with a large count of tasks to do and the date.">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="color-scheme" content="light dark">
  <meta name="referrer" content="no-referrer">
  <!-- The production build adds a Content-Security-Policy meta tag here (see vite.config.ts). -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23D62839'/%3E%3Cpath d='M9 16.5l5 5 9-10.5' fill='none' stroke='%23fff' stroke-width='3.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <!-- Set the theme before first paint so dark-mode users never see a light flash -->
  <script>
    try {
      var t = localStorage.getItem('todo-theme');
      document.documentElement.dataset.theme = t === 'light' || t === 'dark' ? t
        : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    } catch (e) { /* storage blocked: the app sets the theme once it loads */ }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300..900&display=swap" rel="stylesheet">
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
