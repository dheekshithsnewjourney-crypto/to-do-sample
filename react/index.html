<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tasks – React + TypeScript to-do app</title>
  <meta name="description" content="A fast, accessible to-do app with lists, due dates, recurring tasks and a command palette.">
  <meta name="color-scheme" content="light dark">
  <meta name="referrer" content="no-referrer">
  <!-- The production build adds a Content-Security-Policy meta tag here (see vite.config.ts). -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23D62839'/%3E%3Cpath d='M9 16.5l5 5 9-10.5' fill='none' stroke='%23fff' stroke-width='3.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <!-- Set the theme before first paint so dark-mode users never see a light flash -->
  <script>
    try {
      var t = localStorage.getItem('todo-theme');
      document.documentElement.dataset.theme = t === 'light' || t === 'dark' ? t
        : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    } catch (e) { /* storage blocked: the app sets the theme once it loads */ }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
